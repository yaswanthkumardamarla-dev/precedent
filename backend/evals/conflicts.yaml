# Conflict-check cases: the decisions of one (made-up) Python web service, and pull requests labelled
# with the decisions they break.
#
# Every case is searched against all 20 decisions, as in production: the nearest-decision search picks
# up to 10 candidates and the model judges only those. So a missed conflict is either a search miss
# ("not retrieved") or a judgement miss.
#
# A third of the cases break nothing. They follow a rule, remove an offending line, touch only docs, or do
# something that looks close to a rule without breaking it. A false alarm there is the failure that
# gets a review bot muted.
#
# files:   filename and patch (a unified diff; only lines starting with + are additions).
# expect:  keys of the decisions the PR breaks.

decisions:
  - key: logging
    statement: Use the logging module instead of print.
    rationale: Logs can be filtered by level in production.
  - key: type-hints
    statement: All new endpoints must have full type hints for parameters and return values.
    scope: API endpoints in app/api/
  - key: pagination
    statement: List endpoints must be paginated, with a maximum page size of 100.
    scope: API endpoints in app/api/
  - key: utc
    statement: Store timestamps as timezone-aware UTC datetimes using datetime.now(timezone.utc), never datetime.utcnow() or naive datetimes.
  - key: sql-params
    statement: Use parameterized queries; never build SQL with f-strings or string formatting.
    rationale: Prevents SQL injection.
  - key: money-cents
    statement: Store money as integer cents, never as float.
  - key: http-timeout
    statement: Every outbound HTTP call must set an explicit timeout.
  - key: httpx
    statement: Use httpx for HTTP clients, not requests.
  - key: no-bare-except
    statement: Never use a bare `except:`; catch specific exceptions.
  - key: no-secrets-in-code
    statement: Read secrets and service URLs from configuration (app/config.py, environment variables); never hard-code them.
  - key: no-sensitive-logs
    statement: Never log tokens, passwords or full request bodies.
  - key: migrations
    statement: Never edit a migration that has already been released; add a new migration file instead.
    scope: migrations/
  - key: new-deps
    statement: Don't add a new third-party dependency without an approved issue linked in the PR description.
    scope: requirements.txt
  - key: no-sleep-in-tests
    statement: Tests must not call time.sleep; use the fake clock fixture instead.
    scope: tests/
  - key: not-found
    statement: Return 404 when a requested resource doesn't exist, not 200 with an empty or null body.
  - key: snake-case
    statement: JSON responses use snake_case keys.
  - key: async-db
    statement: Async endpoints must use the async database session; no blocking database calls inside async def.
  - key: api-fetch
    statement: Frontend code calls the backend through the shared apiFetch helper, never fetch directly.
    scope: frontend/src/
  - key: lazy-logging
    statement: Pass values to log calls as arguments (logger.info("x %s", y)), not with f-strings.
  - key: regression-tests
    statement: Every bug fix must include a regression test.

cases:
  - id: chk-01
    note: print and a missing type hint in a new endpoint
    expect: [logging, type-hints]
    title: Add user lookup endpoint
    files:
      - filename: app/api/users.py
        patch: |
          @@ -0,0 +1,9 @@
          +from fastapi import APIRouter
          +
          +router = APIRouter()
          +
          +
          +@router.get("/users/{user_id}")
          +def get_user(user_id):
          +    print("fetching user", user_id)
          +    return {"id": user_id}

