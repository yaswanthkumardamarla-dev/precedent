# Extraction cases: review discussions, each labelled with the decisions it really contains.
#
# A decision is a rule the team means to apply beyond this one line of code (see EXTRACTION_PROMPT in
# app/llm.py). About half the cases contain none: one-off fixes, praise, questions, rejected or
# unsettled suggestions. Those are where an extractor goes wrong.
#
# comments:  id, user, body; plus `path` (and optionally `hunk`) for an inline review comment,
#            `reply_to: <id>` for a reply in that thread, or `review: true` for a review summary.
#            Anything else is a comment in the PR conversation.
# expect:    the decisions, each with the comment ids where it is stated or agreed (any one counts).

- id: ext-01
  note: rule stated inline and agreed by the author
  comments:
    - id: 101
      user: maria
      path: app/api/users.py
      hunk: |
        @@ -10,6 +10,8 @@ def get_user(user_id):
        +    print("loading user", user_id)
      body: Please use the logging module rather than print. We want to be able to filter by level in production, so let's do that everywhere from now on.
    - id: 102
      user: dev
      reply_to: 101
      body: Makes sense, switched to logger.debug.
  expect:
    - statement: Use the logging module instead of print.
      sources: [101, 102]

