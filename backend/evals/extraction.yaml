- id: ext-06
  note: rule with a rationale, in the PR conversation
  comments:
    - id: 601
      user: lee
      body: >-
        Heads up for everyone: all timestamps we store must be timezone-aware UTC. We had two incidents
        last quarter from naive datetimes being compared with aware ones. Use datetime.now(timezone.utc),
        never datetime.utcnow().
    - id: 602
      user: dev
      body: Updated the model to use timezone-aware UTC.
  expect:
    - statement: Store timestamps as timezone-aware UTC datetimes, using datetime.now(timezone.utc) rather than datetime.utcnow().
      sources: [601]

